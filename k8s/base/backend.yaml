apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: job-hunter
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8081
      targetPort: http
---
# Uploaded files of the file cabinet (up to 10 GB each, no per-user quota). Bytes live here, metadata in Postgres. The
# local-path class does not enforce the size; the node's free disk is the real limit, and the backend refuses uploads that
# would leave less than jobhunter.files.min-free-bytes (2 GiB). No backup exists yet (see k8s/README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-files
  namespace: job-hunter
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: job-hunter
spec:
  replicas: 1
  # A surge pod might not fit on the single node; stop the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: moldovean/job-hunter-backend:dev
          ports:
            - name: http
              containerPort: 8081
          env:
            # The buildpack's memory calculator reserves 240M of JIT code cache by default, which leaves almost no heap
            # inside a 512Mi limit. 64M is plenty for a service this size; the calculator sizes the heap from the rest.
            - name: JAVA_TOOL_OPTIONS
              value: -XX:ReservedCodeCacheSize=64M
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/jobhunter
            - name: SPRING_DATASOURCE_USERNAME
              value: backend
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-hunter-secrets
                  key: BACKEND_DB_PASSWORD
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ISSUER_URI
            # Optional Secret `anthropic` (see k8s/anthropic.yaml.example): without it CV extraction fails with a clear message.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic
                  key: API_KEY
                  optional: true
          volumeMounts:
            - name: files
              mountPath: /data/files
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: backend-files
