apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: job-hunter
spec:
  selector:
    app.kubernetes.io/name: auth
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: job-hunter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          image: moldovean/job-hunter-auth:dev
          ports:
            - name: http
              containerPort: 9090
          env:
            # The buildpack's memory calculator reserves 240M of JIT code cache by default, which leaves almost no heap
            # inside a 512Mi limit. 64M is plenty for a service this size; the calculator sizes the heap from the rest.
            - name: JAVA_TOOL_OPTIONS
              value: -XX:ReservedCodeCacheSize=64M
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/authdb
            - name: SPRING_DATASOURCE_USERNAME
              value: auth
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-hunter-secrets
                  key: AUTH_DB_PASSWORD
            # Required settings without defaults (app.issuer-uri, app.ui-base-url, app.spa.*): see auth/README.md.
            - name: APP_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ISSUER_URI
            - name: APP_UI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: UI_BASE_URL
            - name: APP_SPA_REDIRECT_URIS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPA_REDIRECT_URIS
            - name: APP_SPA_POST_LOGOUT_REDIRECT_URIS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPA_POST_LOGOUT_URIS
            # Google login and the ADMIN grant. All optional: without the `auth-google` Secret (see k8s/README.md) Google
            # login stays off and nobody gets ADMIN. The admin email is personal data, so it lives in the Secret, not in git.
            - name: APP_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth-google
                  key: CLIENT_ID
                  optional: true
            - name: APP_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-google
                  key: CLIENT_SECRET
                  optional: true
            - name: APP_ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: auth-google
                  key: ADMIN_EMAILS
                  optional: true
          # The context path is /auth, so the health endpoints are under it.
          startupProbe:
            httpGet:
              path: /auth/actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /auth/actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /auth/actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
