# Placeholder until the real UI exists: stock nginx serving one static page. Unknown paths return the page too,
# as a single-page application would.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-content
  namespace: job-hunter
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head><meta charset="utf-8"><title>Job Hunter</title></head>
      <body><h1>Job Hunter</h1><p>The application is being set up.</p></body>
    </html>
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location / {
        try_files $uri /index.html;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: job-hunter
spec:
  selector:
    app.kubernetes.io/name: ui
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: job-hunter
spec:
  replicas: 1
  # Stateless and tiny: a surge pod always fits.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: nginxinc/nginx-unprivileged:1.29.1-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: content
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: content
          configMap:
            name: ui-content
        - name: tmp
          emptyDir: {}
