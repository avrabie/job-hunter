# The web UI: static files served by nginx, built from ui/ (see ui/README.md). The image carries its own nginx
# configuration (single-page fallback, caching, security headers), so nothing is mounted from a ConfigMap.
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: job-hunter
spec:
  selector:
    app.kubernetes.io/name: ui
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: job-hunter
spec:
  replicas: 1
  # Stateless and tiny: a surge pod always fits.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: moldovean/job-hunter-ui:dev
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
