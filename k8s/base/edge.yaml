# The public entry point. Traefik implements the GatewayClass (platform/traefik-values.yaml); its container ports are
# 8000 (HTTP) and 8443 (HTTPS), published on the node's 80 and 443. The overlays set the hostname and TLS.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: job-hunter
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 8000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
# `/` and everything not claimed below: the UI.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ui
  namespace: job-hunter
spec:
  parentRefs:
    - name: edge
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ui
          port: 80
---
# `/api` and `/auth` go to the Spring gateway, which routes them onward. No rewrite: auth keeps its /auth context path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway
  namespace: job-hunter
spec:
  parentRefs:
    - name: edge
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: gateway
          port: 8080
    # Public CV page: `/cv/<handle>` is served by backend as `/api/public/cv/<handle>`. Only the handle is passed on; it is the
    # only thing after `/cv/` that the backend accepts, so `/cv/a/b` and `/cv/` serve no content (the backend answers 401: `/api/public/cv/<one segment>` is the only open path), never the UI.
    - matches:
        - path:
            type: PathPrefix
            value: /cv
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/public/cv
      backendRefs:
        - name: gateway
          port: 8080
