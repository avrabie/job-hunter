# The public entry point. Traefik implements the GatewayClass (platform/traefik-values.yaml); its container ports are
# 8000 (HTTP) and 8443 (HTTPS), published on the node's 80 and 443. The overlays set the hostname and TLS.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: job-hunter
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 8000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
# `/` and everything not claimed below: the UI.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ui
  namespace: job-hunter
spec:
  parentRefs:
    - name: edge
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ui
          port: 80
---
# `/api` and `/auth` go to the Spring gateway, which routes them onward. No rewrite: auth keeps its /auth context path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway
  namespace: job-hunter
spec:
  parentRefs:
    - name: edge
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: gateway
          port: 8080
