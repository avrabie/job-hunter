apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: job-hunter
data:
  # Runs once, on an empty data directory (docker-entrypoint-initdb.d). Creates one role and one database per service
  # and installs pgvector, which needs superuser rights the application roles must not have.
  01-init.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      -v authpw="$AUTH_DB_PASSWORD" -v backendpw="$BACKEND_DB_PASSWORD" <<'SQL'
    CREATE ROLE auth LOGIN PASSWORD :'authpw';
    CREATE ROLE backend LOGIN PASSWORD :'backendpw';
    CREATE DATABASE authdb OWNER auth;
    CREATE DATABASE jobhunter OWNER backend;
    -- A database accepts connections from every role by default; only its owner may connect here.
    REVOKE CONNECT ON DATABASE authdb FROM PUBLIC;
    REVOKE CONNECT ON DATABASE jobhunter FROM PUBLIC;
    SQL
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname jobhunter \
      -c 'CREATE EXTENSION IF NOT EXISTS vector'
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: job-hunter
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: job-hunter
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              # A subdirectory: a volume's root contains lost+found on some storage classes, which initdb rejects.
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: postgres
          envFrom:
            - secretRef:
                name: job-hunter-secrets
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 3
            failureThreshold: 40
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
