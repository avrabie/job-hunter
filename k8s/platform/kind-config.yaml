# Local disposable cluster: same Kubernetes version as the Hetzner node (v1.36.4).
# The edge listens on the node's ports 80 and 443 (Traefik hostPort); they are published on localhost:8080 and :8443.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: job-hunter
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
