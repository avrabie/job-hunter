# Let's Encrypt issuers, solved with HTTP-01 through the application's Gateway (job-hunter/edge, see base/edge.yaml).
# ACME_EMAIL is the contact address registered with Let's Encrypt; it is substituted at apply time and never committed:
#   sed "s/ACME_EMAIL/you@example.org/" k8s/platform/cluster-issuers.yaml | kubectl apply -f -
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ACME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: edge
                namespace: job-hunter
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ACME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-production-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: edge
                namespace: job-hunter
