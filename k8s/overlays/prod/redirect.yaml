# Plain HTTP only redirects. cert-manager's temporary challenge route is more specific (/.well-known/acme-challenge/...)
# and therefore wins over this catch-all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: job-hunter
spec:
  parentRefs:
    - name: edge
      sectionName: http
  hostnames:
    - s4v3.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
