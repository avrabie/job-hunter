# Local PostgreSQL with pgvector. Started automatically by `bootRun` / the IDE (spring-boot-docker-compose,
# development only); or by hand with `docker compose up -d`. Local-only password; override with DB_PASSWORD.
services:
  postgres:
    image: pgvector/pgvector:pg16
    labels:
      # the image name is not plain postgres, so say which service connection this is
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobhunterdev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
