# Local PostgreSQL with pgvector for development: `docker compose up -d`
# The password is read from backend/.env (copy .env.example); it is never committed.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
