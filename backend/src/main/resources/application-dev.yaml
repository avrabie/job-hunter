# Local development: run with `--spring.profiles.active=dev` (see README). The database comes from docker-compose.yml (started automatically); other settings from backend/.env if present.
spring:
  config:
    import: optional:file:.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:http://localhost:8080/auth}

server:
  # 8080 is the gateway's port when the three services run together (bootstrap-gateway).
  port: 8081
