spring:
  application:
    name: backend
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Other files may be up to 10 GB and are checked again by the files service (a CV is at most 5 MB). Parts are spooled
      # into the files volume, so the moved file is a rename on the same disk and not a second copy.
      max-file-size: 10GB
      max-request-size: 10GB
      location: ${jobhunter.files.dir}/tmp
  datasource:
    hikari:
      # Virtual threads make request concurrency cheap; the pool is the real limit on database work.
      maximum-pool-size: 10
  modulith:
    events:
      jdbc:
        # Liquibase owns the event_publication table (db/changelog/001-baseline.sql).
        schema-initialization:
          enabled: false
management:
  endpoints:
    web:
      exposure:
        # Only health is exposed; everything else stays off the web.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Liveness never depends on the database: a database outage must not make Kubernetes restart the pod.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

jobhunter:
  llm:
    # The key is read from the environment and never logged; without it a CV extraction fails with a clear message.
    api-key: ${ANTHROPIC_API_KEY:}
    # Name of a Koog model constant: Haiku_4_5, Sonnet_5 or Opus_5.
    model: Haiku_4_5
  letters:
    # Model for motivation letters (same names as above). Empty = use jobhunter.llm.model. Sonnet_5 writes better letters.
    model: ""
    # Maximum number of letter generations and regenerations per user per hour; each one is one model call. Manual edits do not count.
    per-hour: 20
    # Maximum number of job skill analyses per user per hour; each one is one model call. Counted separately from per-hour.
    # Reading a stored analysis and saving gap notes do not count.
    skills-per-hour: 20
  import:
    # Model for importing a job from a URL (same names as above). Empty = use jobhunter.llm.model.
    model: ""
    # Per user: previews (fetch plus one model call) per hour, and confirms (a shared posting is created) per day.
    previews-per-hour: 20
    confirms-per-day: 10
  cv:
    # Maximum CV text length sent to the model; a longer CV is refused, never truncated.
    max-text-chars: 120000
    # Maximum number of CV extractions per user per hour.
    extractions-per-hour: 20
  cv-export:
    # Maximum number of CV exports per user per hour.
    per-hour: 30
    # How long a third parallel PDF render waits for a free slot before the answer is 503 busy.
    render-wait: 5s
  analysis:
    # Maximum number of open source project analyses per user per hour; each one is one model call.
    per-hour: 10
  public-cv:
    # Public CV page limits. Per client IP and minute: page requests, and the stricter limit for answers that are 404.
    page-per-ip-per-minute: 60
    not-found-per-ip-per-minute: 10
    # Per handle and minute, in total, so a spoofed or shared IP cannot turn the page into a DoS tool.
    page-per-handle-per-minute: 600
    # Per user and hour: handle availability checks and previews.
    handle-checks-per-hour: 60
    previews-per-hour: 30
    # Per user and hour: saves (PUT) and removals (DELETE) of the page, together. Owners can probe handle availability through the
    # 409 answers of a save, so this and the 60 checks per hour are the limit of that probing.
    saves-per-hour: 30
  api-docs:
    # The OpenAPI document and the browsable page, both under /api so the gateway forwards them.
    enabled: true
  files:
    # The files volume (the PersistentVolumeClaim in production). Set with JOBHUNTER_FILES_DIR where it differs.
    dir: /data/files

springdoc:
  api-docs:
    enabled: ${jobhunter.api-docs.enabled}
    path: /api/openapi.json
  swagger-ui:
    enabled: ${jobhunter.api-docs.enabled}
    path: /api/docs
    # The page's own files are served under /api/swagger-ui; the gateway and edge forward only /api and /auth.
    url: /api/openapi.json

logging:
  level:
    # Koog logs the raw text a model returned when a structured answer cannot be parsed (WARN) and each repair attempt
    # (DEBUG). For a CV that text is personal data, so the whole library stays silent. Our own log lines report outcomes.
    ai.koog: "OFF"
