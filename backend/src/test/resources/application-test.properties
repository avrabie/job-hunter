# Test profile: the issuer is never contacted unless a test registers a mock issuer (lazy discovery).
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://issuer.invalid/auth

# Tests never crawl the real boards; crawl tests name their own boards and a local server.
jobhunter.sources.greenhouse.boards=
jobhunter.sources.swissdevjobs.enabled=false

# Limits shared by the ApiTest classes (identical values, so they share one cached context).
jobhunter.cv-export.per-hour=6
jobhunter.files.max-other-bytes=1048576

# The CV export busy test waits for a render slot; a short wait keeps it fast (production default 5s).
jobhunter.cv-export.render-wait=200ms
