server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # The edge never sends these here; if a misrouted request arrives it must not get the app's HTML.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        return 404;
    }
    location /auth/ {
        include /etc/nginx/security-headers.conf;
        return 404;
    }

    # Content-hashed file names: cache for a year, and a missing file is a 404, not the app.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Files and, for any other path, the app shell (deep links such as /callback).
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
