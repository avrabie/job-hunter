spring:
  application:
    name: gateway
  cloud:
    gateway:
      # Spring Cloud Gateway 5.x binds its settings under server.webflux; the old spring.cloud.gateway.* prefix is
      # ignored without error. GatewayConfigurationTests asserts the effective values so a misplaced key fails the build.
      server:
        webflux:
          routes:
            # No path rewriting: auth keeps its /auth context path and backend serves /api/...
            - id: backend
              uri: ${microservices.backend.uri:http://localhost:8081}
              predicates:
                - Path=/api/**
            - id: auth
              uri: ${microservices.auth.uri:http://localhost:9090}
              predicates:
                - Path=/auth/**
          # Which callers may send X-Forwarded-* headers. Required: without it Spring Cloud Gateway treats every caller as
          # untrusted, drops the edge's forwarded host and scheme and adds none of its own. Only private and loopback
          # addresses (the edge inside the cluster, or a developer's machine) are trusted; the gateway is never exposed
          # directly.
          trusted-proxies: '10\..*|172\.(1[6-9]|2[0-9]|3[01])\..*|192\.168\..*|127\..*|localhost|0:0:0:0:0:0:0:1|::1'
          default-filters:
            - SecureHeaders
          filter:
            secure-headers:
              # The default policy blocks the inline styles and scripts of the login page generated by auth.
              disable: content-security-policy
          httpclient:
            connect-timeout: 5000
            response-timeout: 60s
            # Short-lived pooled connections: after a deploy, stale connections to replaced pods caused lingering errors.
            pool:
              max-idle-time: 15s
              max-life-time: 60s
              eviction-interval: 15s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
