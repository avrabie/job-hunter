# Local PostgreSQL for the auth service. Started automatically by `bootRun` / the IDE (spring-boot-docker-compose,
# development only); or by hand with `docker compose up -d`. Local-only password; override with AUTH_DB_PASSWORD.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-authdev}
    ports:
      - "${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - authdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  authdata:
