# Local PostgreSQL for the auth service: `docker compose up -d`
# The password is read from auth/.env (copy .env.example); it is never committed.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Copy .env.example to .env and set AUTH_DB_PASSWORD}
    ports:
      - "${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - authdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  authdata:
